# Stage file for chapter 4. Copy it over .github/workflows/pipeline.yml
# (cp stages/pipeline-ch04.yml .github/workflows/pipeline.yml) and push.
# The DevSecOps pipeline. It grows one block per chapter; each block is marked.
#   Chapter 4  secrets (Gitleaks)      Chapter 8   DefectDojo upload
#   Chapter 5  code (Semgrep)          Chapter 9   alerts through Kafka
#   Chapter 6  image + SBOM (Trivy)    Chapter 10  gated staging deployment
#   Chapter 7  the security gate
name: pipeline
on:
  push:
    branches: [main, testing]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  scan:
    name: Security scans
    runs-on: [self-hosted, devsecops]
    timeout-minutes: 45
    steps:
      - name: Check out this repository (full history for Gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare the reports folder
        run: rm -rf reports && mkdir reports

      # --- Chapter 4: secret scanning ---------------------------------------
      - name: Gitleaks - secrets in this repository and its history
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --report-format json --report-path reports/gitleaks.json --exit-code 0 .

      - name: Show the findings on the run summary page
        if: ${{ always() }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          path = "reports/gitleaks.json"
          items = json.load(open(path)) if os.path.exists(path) and os.path.getsize(path) else []
          print("## Gitleaks: secrets scan")
          if not items:
              print("No secrets found in the repository or its history.")
          else:
              print(f"**{len(items)} possible secret(s) found.** Values are redacted.\n")
              print("| Rule | File | Line | Commit |")
              print("| --- | --- | --- | --- |")
              for i in items:
                  print(f"| {i.get('RuleID')} | {i.get('File')} | {i.get('StartLine')} | {str(i.get('Commit'))[:8]} |")
          PY

      # --- Always: keep the reports and clean up ----------------------------
      - name: Save reports as an artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.run_id }}
          path: reports/
          retention-days: 14

      - name: Give root-owned files back to the runner user
        if: ${{ always() }}
        run: docker run --rm -v "$PWD:/w" alpine:3.20 chown -R "$(id -u):$(id -g)" /w
